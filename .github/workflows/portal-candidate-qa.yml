name: Portal candidate QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: R38 lazy graphics build and syntax
        run: |
          node --version
          node --check scripts/assemble-r38.cjs
          node --check scripts/assemble-r37.cjs
          node --check scripts/qa-r38-fallback.cjs
          node --check scripts/assemble-r39.cjs
          node --check source/r39/clean-url.js
          npm run build
          node scripts/qa-r39-url.cjs
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/sunrise-qa" --no-package-lock --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/sunrise-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: R38 context-loss, fallback and responsive browser QA
        env:
          NODE_PATH: ${{ runner.temp }}/sunrise-qa/node_modules
        run: |
          node scripts/qa-r38-fallback.cjs
      - name: Archive tracked source checkpoint
        if: startsWith(github.head_ref, 'closeout/') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/sunrise-source"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/sunrise-source"
          git rev-parse HEAD > "$RUNNER_TEMP/sunrise-source/CHECKPOINT_COMMIT.txt"
          git rev-parse HEAD^{tree} >> "$RUNNER_TEMP/sunrise-source/CHECKPOINT_COMMIT.txt"
      - name: Upload source checkpoint
        if: startsWith(github.head_ref, 'closeout/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Sunrise_Group_WEB_R39
          path: ${{ runner.temp }}/sunrise-source/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
